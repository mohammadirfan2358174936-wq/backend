server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    whitelabel:
      enabled: false
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/plain
    min-response-size: 2048

spring:
  application:
    name: eventforge

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:postgres}

  # ---------------------------------------------------------------- datasource
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/eventora}
    username: ${DB_USER:eventora}
    password: ${DB_PASSWORD:eventora}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
    hikari:
      pool-name: eventora-hikari
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:5}
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 30000
      # Fail fast on a misconfigured schema instead of 30s of stack traces.
      initialization-fail-timeout: 1
      leak-detection-threshold: 60000

  # ------------------------------------------------------------------- JPA
  jpa:
    open-in-view: false          # forces all data access into the service layer
    hibernate:
      ddl-auto: ${DB_DDL_AUTO:update}
    properties:
      hibernate:
        dialect: ${DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
        format_sql: false
        jdbc:
          batch_size: 40
          order_inserts: true
          order_updates: true
          fetch_size: 60
        query:
          in_clause_parameter_padding: true
        default_batch_fetch_size: 32
        connection:
          provider_disables_autocommit: false
    show-sql: false

  # --------------------------------------------------------------- flyway
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

  # -------------------------------------------------------------- jackson
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
      write-durations-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    time-zone: UTC

  # ----------------------------------------------------------------- cache
  cache:
    type: caffeine
    caffeine-spec: maximumSize=2000,expireAfterWrite=10m,recordStats

  # ------------------------------------------------------------------- mvc
  mvc:
    problemdetails:
      enabled: false
    async:
      request-timeout: 30000

  main:
    banner-mode: console
    lazy-initialization: false

# ------------------------------------------------------------------- app
app:
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-in-production-this-must-be-at-least-64-characters-long-for-hs512-algorithm}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000}     # 24h
      issuer: eventora
      clock-skew-seconds: 30
    password-strength: ${BCRYPT_STRENGTH:12}
    max-login-attempts: 5
    lock-duration-minutes: 15
    # Single source of truth for the browser allow-list (mirrored by CORS).
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:4173,http://127.0.0.1:5173,http://127.0.0.1:3000,http://127.0.0.1:4173,https://frontend-inky-theta-28.vercel.app}
    max-age-seconds: 3600
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:4173,http://127.0.0.1:5173,http://127.0.0.1:3000,http://127.0.0.1:4173,https://frontend-inky-theta-28.vercel.app}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"
    max-age-seconds: 3600
  seed:
    enabled: ${SEED_ENABLED:false}
    admin-email: ${SEED_ADMIN_EMAIL:admin@eventora.io}
    admin-password: ${SEED_ADMIN_PASSWORD:Admin@123}
  events:
    # Recent organiser actions kept in the live in-memory deque per event.
    action-stack-capacity: ${ACTION_STACK_CAPACITY:50}
    page-size-default: 12
    page-size-max: 100
  pagination:
    default-size: 12
    max-size: 100

# -------------------------------------------------------------- actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,flyway
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
    metrics:
      enable:
        hikaricp: true
  health:
    diskspace:
      enabled: false
    redis:
      enabled: ${MANAGEMENT_HEALTH_REDIS_ENABLED:false}
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: eventforge
    distribution:
      percentiles-histogram:
        http.server.requests: true

# ------------------------------------------------------------ springdoc
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    try-it-out-enabled: true
  show-actuator: false

# ---------------------------------------------------------------- logging
logging:
  level:
    root: INFO
    com.example.eventmanagement: ${LOG_LEVEL:DEBUG}
    org.springframework.security: INFO
    org.hibernate.SQL: ${SQL_LOG_LEVEL:WARN}
    org.hibernate.orm.jdbc.bind: ${SQL_BIND_LOG_LEVEL:WARN}
  pattern:
    console: "%d{HH:mm:ss.SSS} %clr(%-5level) [%thread] %clr(%logger{40}){cyan} — %msg%n"

info:
  app:
    name: Eventforge
    description: Premium Event Management Platform
    version: 1.0.0
